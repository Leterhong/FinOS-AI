# FinOS AI — CI 质量门禁
# README 宣称的四条门禁在这里自动执行：typecheck / npm test / build / test:backend
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: 前端（类型检查 / 测试 / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:unit
      - run: npm run build
        env:
          # 构建期仅编译，不连接任何真实模型服务
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: 后端（pytest 回归）
    runs-on: ubuntu-latest
    env:
      # 测试隔离环境：独立 SQLite + 强随机测试密钥（见 tests/conftest.py）
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # 与本地验证环境一致（README 要求 3.11+，3.12 满足）
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: pip install ruff
      - run: ruff check backend
      - run: npm run test:backend

  e2e:
    name: 端到端（主链路 / mock LLM）
    runs-on: ubuntu-latest
    env:
      ENV: test
      E2E_VERBOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: pip install -r backend/requirements.txt
      - run: node tests/e2e/main-chain.mjs
