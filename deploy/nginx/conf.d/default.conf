# ============================================================
# FinOS AI — 默认站点（HTTP，开箱即用）
# 一条命令 docker compose up -d 即可通过 http://localhost 访问。
# 需要 HTTPS 时使用 docker-compose.prod.yml（挂载 conf.d-tls + 证书）。
# ============================================================

upstream finos_web {
    server web:3000;
    keepalive 32;
}

upstream finos_api {
    server api:8300;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 容器健康检查探针（不走上游，永远可用）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Next.js 孤岛路由（不转发 FastAPI 后端，由 web 服务处理）──
    # 这些路径在 FastAPI 后端无对应实现，必须由 Next.js 处理：
    #   · 鉴权 cookie 桥接：/api/auth/session（种 finos_session）、/api/auth/logout（清）
    #   · 前端直连功能路由：avatar / account / profile / models / ai 子路由 /
    #     finance / financial-data / knowledge / market
    # 若全部转发到后端会 404，导致登录后 middleware 认不出会话（死循环回 /login）。
    location = /api/auth/session   { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location = /api/auth/logout    { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/auth/avatar      { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/auth/account     { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/ai/agent         { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/ai/cache         { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/ai/chat          { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/ai/copilot       { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/ai/monitor       { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/ai/plan          { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/ai/proactive     { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/ai/review        { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/ai/workflow      { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/ai/usage         { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/documents        { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/finance          { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/financial-data   { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/knowledge        { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/models           { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/profile          { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/market           { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/memory           { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/wealth           { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }

    # 登录接口更严格限流（防撞库）
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://finos_api;
        include /etc/nginx/proxy_params.conf;
    }

    # 后端 API（其余 /api/* 全部转发 FastAPI）
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://finos_api;
        include /etc/nginx/proxy_params.conf;
        # AI 流式响应：关闭缓冲并放宽超时
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 前端（含 Next.js 静态资源与 RSC 流）
    location / {
        limit_req zone=web_limit burst=60 nodelay;
        proxy_pass http://finos_web;
        include /etc/nginx/proxy_params.conf;
        proxy_buffering off;
    }
}
