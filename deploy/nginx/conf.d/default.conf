# ============================================================
# FinOS AI — 默认站点（HTTP，开箱即用）
# 一条命令 docker compose up -d 即可通过 http://localhost 访问。
# 需要 HTTPS 时使用 docker-compose.prod.yml（挂载 conf.d-tls + 证书）。
# ============================================================

upstream finos_web {
    server web:3000;
    keepalive 32;
}

upstream finos_api {
    server api:8300;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 容器健康检查探针（不走上游，永远可用）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Next.js 孤岛路由（不转发 FastAPI 后端，由 web 服务处理）──
    # 2.0 实际存活的 Next Route Handlers 只有三个前缀：
    #   · /api/workspace  工作区会话（HttpOnly cookie）
    #   · /api/enterprise 企业 AI 网关：助手 / Agent / 投研 / 资料研判
    #   · /api/models     模型中心 CRUD / 测试 / playground
    # 这三个前缀若转发到 FastAPI 会 404（企业 AI 主链路全部失效）。
    location /api/workspace  { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/enterprise { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }
    location /api/models     { proxy_pass http://finos_web; include /etc/nginx/proxy_params.conf; }

    # 登录接口更严格限流（防撞库）
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://finos_api;
        include /etc/nginx/proxy_params.conf;
    }

    # 后端 API（其余 /api/* 全部转发 FastAPI）
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://finos_api;
        include /etc/nginx/proxy_params.conf;
        # AI 流式响应：关闭缓冲并放宽超时
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 前端（含 Next.js 静态资源与 RSC 流）
    location / {
        limit_req zone=web_limit burst=60 nodelay;
        proxy_pass http://finos_web;
        include /etc/nginx/proxy_params.conf;
        proxy_buffering off;
    }
}
