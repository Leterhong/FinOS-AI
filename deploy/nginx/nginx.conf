user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 50m;
    server_tokens off;

    log_format finos '$remote_addr - $status $request_time "$request" "$http_user_agent"';
    access_log /var/log/nginx/access.log finos;

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 基础安全头（全局）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 速率限制
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=20r/s;
    limit_req_zone $binary_remote_addr zone=web_limit:10m   rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    include /etc/nginx/conf.d/*.conf;
}
