# Prometheus 监控配置
# /api/metrics 需要 X-Metrics-Key（值为 .env 中的 BACKUP_API_KEY）；
# BACKUP_API_KEY 未配置时该端点 fail-closed，无法抓取。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: finos-api
    metrics_path: /api/metrics
    # 在此填入与 .env 中 BACKUP_API_KEY 一致的值
    authorization:
      type: MetricsKey
      credentials: "CHANGE_ME_BACKUP_API_KEY"
    static_configs:
      - targets: ["api:8300"]

  - job_name: finos-web
    static_configs:
      - targets: ["web:3000"]
