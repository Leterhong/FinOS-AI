# Prometheus 监控配置
# /api/metrics 需要 X-Metrics-Key（值为 .env 中的 BACKUP_API_KEY）；
# BACKUP_API_KEY 未配置时该端点 fail-closed，无法抓取。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: finos-api
    metrics_path: /api/metrics/prometheus
    # 与后端 X-Metrics-Key 鉴权对齐（值为 .env 中 BACKUP_API_KEY）
    http_headers:
      x-metrics-key:
        values: ["CHANGE_ME_BACKUP_API_KEY"]
    static_configs:
      - targets: ["api:8300"]

  - job_name: finos-web
    static_configs:
      - targets: ["web:3000"]
