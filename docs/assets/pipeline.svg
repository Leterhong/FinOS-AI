<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="title desc">
  <title id="title">FinOS AI 核心研判链路</title>
  <desc id="desc">企业项目进入资料解析、事实抽取、规则匹配、风险信号，再经人工核验与研判建议形成证据引用并流转为流程任务。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .node-label { font-family: -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 600; }
      .root-label { font-family: -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; }
    </style>
  </defs>

  <rect x="1" y="1" width="978" height="428" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="415" y="37" width="150" height="54" rx="12" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.5"/>
  <text class="root-label" x="490" y="64" text-anchor="middle" dominant-baseline="middle" fill="#075985">企业项目</text>

  <rect x="75" y="158" width="150" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="node-label" x="150" y="185" text-anchor="middle" dominant-baseline="middle" fill="#334155">资料解析</text>

  <rect x="305" y="158" width="150" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="node-label" x="380" y="185" text-anchor="middle" dominant-baseline="middle" fill="#334155">事实抽取</text>

  <rect x="535" y="158" width="150" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="node-label" x="610" y="185" text-anchor="middle" dominant-baseline="middle" fill="#334155">规则匹配</text>

  <rect x="785" y="158" width="150" height="54" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="node-label" x="860" y="185" text-anchor="middle" dominant-baseline="middle" fill="#b45309">风险信号</text>

  <rect x="75" y="303" width="150" height="54" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text class="node-label" x="150" y="330" text-anchor="middle" dominant-baseline="middle" fill="#0e7490">证据引用</text>

  <rect x="305" y="303" width="150" height="54" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text class="node-label" x="380" y="330" text-anchor="middle" dominant-baseline="middle" fill="#0e7490">人工核验</text>

  <rect x="535" y="303" width="150" height="54" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="node-label" x="610" y="330" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8">研判建议</text>

  <rect x="785" y="303" width="150" height="54" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text class="node-label" x="860" y="330" text-anchor="middle" dominant-baseline="middle" fill="#15803d">流程任务</text>

  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M490 91 C 490 140, 150 110, 150 158" marker-end="url(#arrow)"/>
    <line x1="225" y1="185" x2="305" y2="185" marker-end="url(#arrow)"/>
    <line x1="455" y1="185" x2="535" y2="185" marker-end="url(#arrow)"/>
    <line x1="685" y1="185" x2="785" y2="185" marker-end="url(#arrow)"/>
    <line x1="150" y1="212" x2="150" y2="303" marker-end="url(#arrow)"/>
    <path d="M860 212 L 860 262 L 685 262 L 685 303" marker-end="url(#arrow)"/>
    <line x1="685" y1="330" x2="785" y2="330" marker-end="url(#arrow)"/>
    <line x1="535" y1="330" x2="455" y2="330" marker-end="url(#arrow)"/>
    <line x1="305" y1="330" x2="225" y2="330" marker-end="url(#arrow)"/>
  </g>
</svg>
