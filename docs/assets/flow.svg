</g>
<g>
<rect x="360" y="150" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="420" y="172" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">规则匹配</text>
</g>
<g>
<rect x="520" y="150" width="120" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="580" y="172" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">风险信号</text>
</g>

<g>
