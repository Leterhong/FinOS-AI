<text x="100" y="284" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">证据引用</text>
</g>
<g>
<rect x="200" y="262" width="120" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="260" y="284" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">人工核验</text>
</g>
<g>
<rect x="360" y="262" width="120" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="420" y="284" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">研判建议</text>
</g>
<g>
