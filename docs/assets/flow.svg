<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" width="100%" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<title>FinOS AI 企业经营与风险研判主链路</title>
<desc>企业项目向下进入资料解析，依次经事实抽取、规则匹配得到风险信号；风险信号向下进入研判建议，研判建议经人工核验回到证据引用，并向右流转为流程任务。</desc>
